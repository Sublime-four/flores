<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Feliz Día de las Flores Amarillas</title>
<meta name="description" content="Una noche estrellada con un ramo de flores amarillas para alguien especial, celebrando el 21 de septiembre.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Cormorant+Garamond:ital,wght@1,400;1,500&display=swap" rel="stylesheet">
<style>
  :root {
    --gold: #f4c542;
    --amber: #ff9d3d;
    --cream: #fff6e0;
    --brown: #5a3a1a;
    --brown-dark: #3b2410;
    --night-1: #030612;
    --night-2: #0a1230;
    --night-3: #10193f;
    --petal-dur: 1.1s;
    --bouquet-start: 0.4s;
    --bouquet-total: 2.6s;
    --title-delay: calc(var(--bouquet-start) + var(--bouquet-total) + 0.2s);
    --subtitle-delay: calc(var(--title-delay) + 0.9s);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  .sr-only {
    position: absolute;
    width: 1px; height: 1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
  }

  html, body {
    height: 100%;
    overflow-x: hidden;
    overflow-y: auto;
  }

  body {
    background: radial-gradient(ellipse at 50% 110%, var(--night-3) 0%, var(--night-2) 45%, var(--night-1) 100%);
    color: var(--cream);
    font-family: 'Cormorant Garamond', Georgia, 'Times New Roman', serif;
    -webkit-font-smoothing: antialiased;
    position: relative;
  }

  /* ---------- Capas de fondo ---------- */
  #stars, #fireflies, #petals {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
  }
  #stars { z-index: 0; }
  #fireflies { z-index: 1; }
  #petals { z-index: 3; }

  .star {
    position: absolute;
    border-radius: 50%;
    background: var(--cream);
    box-shadow: 0 0 6px 1px rgba(255, 246, 224, 0.6);
    animation: twinkle var(--dur, 3s) ease-in-out infinite alternate;
    animation-delay: var(--delay, 0s);
    opacity: var(--min, 0.3);
  }
  @keyframes twinkle {
    from { opacity: var(--min, 0.2); transform: scale(0.8); }
    to   { opacity: 1; transform: scale(1.15); }
  }

  .firefly {
    position: absolute;
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: var(--gold);
    box-shadow:
      0 0 8px 2px rgba(244, 197, 66, 0.9),
      0 0 22px 6px rgba(255, 157, 61, 0.45);
    animation:
      drift var(--dur, 14s) ease-in-out infinite alternate,
      pulse var(--pulse, 3s) ease-in-out infinite;
    animation-delay: var(--delay, 0s), var(--delay2, 0s);
    opacity: 0.85;
  }
  @keyframes drift {
    0%   { transform: translate(0, 0); }
    25%  { transform: translate(var(--dx1), var(--dy1)); }
    50%  { transform: translate(var(--dx2), var(--dy2)); }
    75%  { transform: translate(var(--dx3), var(--dy3)); }
    100% { transform: translate(var(--dx4), var(--dy4)); }
  }
  @keyframes pulse {
    0%, 100% { opacity: 0.25; }
    50%      { opacity: 1; }
  }

  /* ---------- Pétalos que caen ---------- */
  .petal {
    position: absolute;
    top: -40px;
    width: 14px;
    height: 24px;
    background: linear-gradient(160deg, var(--cream) 0%, var(--gold) 45%, var(--amber) 100%);
    border-radius: 100% 100% 100% 100% / 30% 30% 70% 70%;
    opacity: 0;
    filter: drop-shadow(0 0 4px rgba(244, 197, 66, 0.5));
    animation:
      fall var(--dur, 12s) linear infinite,
      sway var(--sway, 3s) ease-in-out infinite alternate;
    animation-delay: var(--delay, 0s), 0s;
  }
  @keyframes fall {
    0%   { transform: translateY(-40px) rotate(0deg); opacity: 0; }
    5%   { opacity: 0.95; }
    90%  { opacity: 0.9; }
    100% { transform: translateY(110vh) rotate(var(--rot, 540deg)); opacity: 0; }
  }
  @keyframes sway {
    from { margin-left: calc(var(--amp, 30px) * -1); }
    to   { margin-left: var(--amp, 30px); }
  }

  /* ---------- Escena principal ---------- */
  main {
    position: relative;
    z-index: 2;
    min-height: 100%;
    display: grid;
    grid-template-rows: auto minmax(0, 1fr) auto;
    align-items: center;
    justify-items: center;
    padding: clamp(1rem, 4vh, 2.5rem) 1rem calc(clamp(1rem, 4vh, 2.5rem) + 1.6rem);
    gap: 0.5rem;
  }

  .title {
    grid-row: 1;
    font-family: 'Dancing Script', 'Brush Script MT', cursive;
    font-weight: 700;
    font-size: clamp(1.9rem, 7.5vw, 4.2rem);
    line-height: 1.15;
    text-align: center;
    color: var(--gold);
    text-shadow:
      0 0 6px rgba(255, 246, 224, 0.8),
      0 0 18px rgba(244, 197, 66, 0.85),
      0 0 40px rgba(255, 157, 61, 0.6),
      0 2px 4px rgba(0, 0, 0, 0.6);
    opacity: 0;
    transform: translateY(12px);
    animation: fadeUp 1.4s ease-out forwards;
    animation-delay: var(--title-delay);
    max-width: 22ch;
  }

  .subtitle {
    grid-row: 3;
    font-style: italic;
    font-weight: 500;
    font-size: clamp(1.05rem, 3.6vw, 1.55rem);
    line-height: 1.5;
    text-align: center;
    color: var(--cream);
    text-shadow: 0 0 12px rgba(244, 197, 66, 0.45), 0 1px 3px rgba(0, 0, 0, 0.7);
    max-width: 46ch;
    opacity: 0;
    transform: translateY(10px);
    animation: fadeUp 1.4s ease-out forwards;
    animation-delay: var(--subtitle-delay);
  }
  .subtitle .heart {
    color: var(--amber);
    font-style: normal;
  }

  @keyframes fadeUp {
    to { opacity: 1; transform: translateY(0); }
  }

  /* ---------- Ramo ---------- */
  .bouquet-wrap {
    grid-row: 2;
    position: relative;
    width: min(90vw, 52vh, 520px);
    aspect-ratio: 1 / 1;
    display: grid;
    place-items: center;
  }

  .glow {
    position: absolute;
    inset: -10%;
    border-radius: 50%;
    background: radial-gradient(circle,
      rgba(255, 246, 224, 0.55) 0%,
      rgba(244, 197, 66, 0.45) 22%,
      rgba(255, 157, 61, 0.22) 45%,
      rgba(255, 157, 61, 0) 70%);
    filter: blur(8px);
    opacity: 0;
    animation: glowPulse 6s ease-in-out forwards;
    animation-delay: var(--bouquet-start);
    pointer-events: none;
  }
  @keyframes glowPulse {
    0%   { opacity: 0;   transform: scale(0.4); }
    30%  { opacity: 1;   transform: scale(1.05); }
    100% { opacity: 0.28; transform: scale(1); }
  }

  .bouquet {
    position: relative;
    width: 100%;
    height: 100%;
  }

  .flower {
    position: absolute;
    left: var(--x);
    top: var(--y);
    width: var(--size);
    height: var(--size);
    transform: translate(-50%, -50%) rotate(var(--rot, 0deg)) scale(0);
    transform-origin: 50% 50%;
    animation: bloom var(--petal-dur) cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    animation-delay: calc(var(--bouquet-start) + var(--d, 0s));
    filter: drop-shadow(0 6px 10px rgba(0, 0, 0, 0.55));
    will-change: transform;
  }
  @keyframes bloom {
    0%   { transform: translate(-50%, -50%) rotate(calc(var(--rot, 0deg) - 40deg)) scale(0); }
    100% { transform: translate(-50%, -50%) rotate(var(--rot, 0deg)) scale(1); }
  }
  .flower svg {
    width: 100%;
    height: 100%;
    display: block;
    overflow: visible;
  }

  /* Balanceo suave después de florecer */
  .bouquet.settled .flower {
    animation:
      bloom var(--petal-dur) cubic-bezier(0.34, 1.56, 0.64, 1) forwards,
      breeze calc(5s + var(--d, 0s) * 2) ease-in-out infinite alternate;
    animation-delay: calc(var(--bouquet-start) + var(--d, 0s)), calc(var(--bouquet-start) + var(--d, 0s) + var(--petal-dur));
  }
  @keyframes breeze {
    from { transform: translate(-50%, -50%) rotate(calc(var(--rot, 0deg) - 2deg)) scale(1); }
    to   { transform: translate(-50%, -50%) rotate(calc(var(--rot, 0deg) + 2deg)) scale(1); }
  }

  /* Tallos */
  .stems {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    overflow: visible;
    pointer-events: none;
  }
  .stems path {
    fill: none;
    stroke: #3e7d3a;
    stroke-width: 2.2;
    stroke-linecap: round;
    stroke-dasharray: 400;
    stroke-dashoffset: 400;
    animation: grow 1.6s ease-out forwards;
    animation-delay: calc(var(--bouquet-start) - 0.2s);
    opacity: 0.85;
  }
  @keyframes grow { to { stroke-dashoffset: 0; } }

  .ribbon {
    opacity: 0;
    animation: fadeUp 0.9s ease-out forwards;
    animation-delay: calc(var(--bouquet-start) + 1.4s);
  }

  /* ---------- Interacción ---------- */
  .bouquet-wrap { pointer-events: none; }
  .flower {
    pointer-events: auto;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  .flower:focus-visible { outline: 2px dashed var(--cream); outline-offset: 6px; border-radius: 50%; }

  /* Salto de la flor al tocarla (se aplica sobre un envoltorio interno para no pisar la animación de florecer) */
  .flower .inner { width: 100%; height: 100%; }
  .flower.pop .inner { animation: pop 0.6s cubic-bezier(0.34, 1.56, 0.64, 1); }
  @keyframes pop {
    0%   { transform: scale(1) rotate(0deg); }
    35%  { transform: scale(1.28) rotate(14deg); }
    70%  { transform: scale(0.94) rotate(-8deg); }
    100% { transform: scale(1) rotate(0deg); }
  }

  #fx {
    position: fixed;
    inset: 0;
    z-index: 4;
    pointer-events: none;
    overflow: hidden;
  }

  .spark {
    position: absolute;
    left: 0; top: 0;
    width: var(--s, 6px);
    height: var(--s, 6px);
    border-radius: 50%;
    background: var(--c, var(--gold));
    box-shadow: 0 0 8px 2px rgba(244, 197, 66, 0.8);
    transform: translate(var(--x), var(--y));
    animation: burst var(--dur, 0.9s) cubic-bezier(0.2, 0.8, 0.3, 1) forwards;
  }
  @keyframes burst {
    0%   { transform: translate(var(--x), var(--y)) scale(1); opacity: 1; }
    100% { transform: translate(calc(var(--x) + var(--tx)), calc(var(--y) + var(--ty) + 40px)) scale(0.2); opacity: 0; }
  }

  .msg {
    position: absolute;
    left: 0; top: 0;
    transform: translate(-50%, -50%);
    font-family: 'Dancing Script', 'Brush Script MT', cursive;
    font-weight: 700;
    font-size: clamp(1.2rem, 4.5vw, 1.9rem);
    color: var(--cream);
    white-space: nowrap;
    text-shadow:
      0 0 8px rgba(244, 197, 66, 0.9),
      0 0 22px rgba(255, 157, 61, 0.7),
      0 2px 3px rgba(0, 0, 0, 0.8);
    animation: floatUp 2.4s ease-out forwards;
  }
  @keyframes floatUp {
    0%   { opacity: 0; transform: translate(-50%, -30%) scale(0.7); }
    15%  { opacity: 1; transform: translate(-50%, -60%) scale(1.05); }
    100% { opacity: 0; transform: translate(-50%, -260%) scale(1); }
  }

  .mini-flower {
    position: absolute;
    left: 0; top: 0;
    width: var(--s, 56px);
    height: var(--s, 56px);
    transform: translate(-50%, -50%) rotate(var(--rot, 0deg)) scale(0);
    filter: drop-shadow(0 0 10px rgba(244, 197, 66, 0.6));
    animation:
      miniBloom 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) forwards,
      miniFade 1.6s ease-in forwards;
    animation-delay: 0s, 4s;
  }
  .mini-flower svg { width: 100%; height: 100%; display: block; }
  @keyframes miniBloom {
    to { transform: translate(-50%, -50%) rotate(var(--rot, 0deg)) scale(1); }
  }
  @keyframes miniFade {
    to { opacity: 0; transform: translate(-50%, -80%) rotate(var(--rot, 0deg)) scale(0.6); }
  }

  .hint {
    position: fixed;
    left: 50%;
    bottom: max(0.9rem, env(safe-area-inset-bottom));
    transform: translateX(-50%);
    z-index: 5;
    font-style: italic;
    font-size: clamp(0.85rem, 2.8vw, 1rem);
    color: rgba(255, 246, 224, 0.75);
    text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8);
    pointer-events: none;
    opacity: 0;
    animation: hintIn 1.2s ease-out forwards, hintPulse 2.4s ease-in-out infinite;
    animation-delay: calc(var(--subtitle-delay) + 1.2s), calc(var(--subtitle-delay) + 2.4s);
    transition: opacity 0.6s ease;
  }
  .hint.hide { opacity: 0 !important; animation: none; }
  @keyframes hintIn { to { opacity: 1; } }
  @keyframes hintPulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.45; } }

  /* Destello del título en la sorpresa (sobre un span interno para no reiniciar el fade-in) */
  .title span { display: inline-block; }
  .title span.shine { animation: titleShine 1.6s ease-in-out; }
  @keyframes titleShine {
    0%, 100% { transform: scale(1); filter: brightness(1); }
    40%      { transform: scale(1.06); filter: brightness(1.6); }
  }

  /* ---------- Accesibilidad: movimiento reducido ---------- */
  @media (prefers-reduced-motion: reduce) {
    .star, .firefly, .petal, .flower, .glow, .title, .subtitle, .stems path, .ribbon,
    .bouquet.settled .flower, .flower.pop .inner, .spark, .msg, .mini-flower, .hint, .title span.shine {
      animation: none !important;
    }
    .msg { opacity: 1; transform: translate(-50%, -120%); transition: opacity 0.4s; }
    .mini-flower { transform: translate(-50%, -50%) rotate(var(--rot, 0deg)) scale(1); transition: opacity 0.6s; }
    .hint { opacity: 1; }
    .flower { transform: translate(-50%, -50%) rotate(var(--rot, 0deg)) scale(1); }
    .glow { opacity: 0.35; transform: scale(1); }
    .title, .subtitle, .ribbon { opacity: 1; transform: none; }
    .stems path { stroke-dashoffset: 0; }
    .star { opacity: 0.7; }
    .firefly { opacity: 0.8; }
    #petals { display: none; }
  }

  @media (max-width: 480px) {
    .bouquet-wrap { width: min(92vw, 50vh); }
    main { gap: 0.25rem; }
  }
  @media (max-height: 560px) and (orientation: landscape) {
    .bouquet-wrap { width: min(50vh, 60vw); }
  }
</style>
</head>
<body>

<div id="stars" aria-hidden="true"></div>
<div id="fireflies" aria-hidden="true"></div>

<main>
  <h1 class="title"><span id="titleText">¡Feliz Día de las Flores Amarillas!</span></h1>

  <div class="bouquet-wrap" role="group" aria-label="Ramo de girasoles amarillos: toca cada flor para un mensaje">
    <div class="glow"></div>
    <div class="bouquet" id="bouquet">
      <svg class="stems" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
        <path d="M50 96 C 50 80, 48 66, 50 50" />
        <path d="M50 96 C 46 80, 36 66, 30 44" />
        <path d="M50 96 C 54 80, 64 66, 70 44" />
        <path d="M50 96 C 47 82, 40 74, 22 60" />
        <path d="M50 96 C 53 82, 60 74, 78 60" />
        <path d="M50 96 C 49 84, 42 78, 38 70" />
        <path d="M50 96 C 51 84, 58 78, 62 70" />
        <path d="M50 96 C 50 86, 50 78, 50 74" />
        <g class="ribbon">
          <path d="M44 88 Q 50 84 56 88 Q 50 92 44 88 Z" fill="#ff9d3d" stroke="#e07f24" stroke-width="0.6" />
          <path d="M47 89 L 43 97 M53 89 L 57 97" stroke="#ff9d3d" stroke-width="1.6" />
        </g>
      </svg>
      <!-- Las flores se generan con JavaScript -->
    </div>
  </div>

  <p class="subtitle">
    Unas flores amarillas para alguien que ilumina
    cualquier día con su alegría. <span class="heart">♥</span>
  </p>
</main>

<div id="petals" aria-hidden="true"></div>
<div id="fx" aria-hidden="true"></div>
<p class="hint" id="hint">Toca las flores… o el cielo ✨</p>
<div id="live" class="sr-only" aria-live="polite"></div>

<script>
(function () {
  'use strict';

  var reduceMotion = window.matchMedia &&
    window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var isSmall = window.innerWidth < 600;

  function rand(min, max) { return Math.random() * (max - min) + min; }

  /* ---------- Girasol en SVG ---------- */
  var flowerCounter = 0;
  function sunflowerSVG(petalCount, hue) {
    var id = 'f' + (flowerCounter++);
    var petals = '';
    for (var i = 0; i < petalCount; i++) {
      var angle = (360 / petalCount) * i;
      petals +=
        '<path d="M50 50 C 44 38, 44 18, 50 6 C 56 18, 56 38, 50 50 Z" ' +
        'fill="url(#pg' + id + ')" stroke="#d99a1e" stroke-width="0.4" ' +
        'transform="rotate(' + angle + ' 50 50)"/>';
    }
    // Segunda capa de pétalos, más cortos y desfasados
    var inner = '';
    for (var j = 0; j < petalCount; j++) {
      var a2 = (360 / petalCount) * j + (180 / petalCount);
      inner +=
        '<path d="M50 50 C 45 40, 45 26, 50 16 C 55 26, 55 40, 50 50 Z" ' +
        'fill="url(#pg2' + id + ')" opacity="0.95" ' +
        'transform="rotate(' + a2 + ' 50 50)"/>';
    }
    // Semillas del centro (patrón fibonacci)
    var seeds = '';
    var seedCount = 60;
    var golden = 137.508;
    for (var k = 0; k < seedCount; k++) {
      var r = 1.6 * Math.sqrt(k);
      var t = k * golden * Math.PI / 180;
      var cx = 50 + r * Math.cos(t);
      var cy = 50 + r * Math.sin(t);
      seeds += '<circle cx="' + cx.toFixed(2) + '" cy="' + cy.toFixed(2) +
        '" r="0.9" fill="' + (k % 2 ? '#2a1607' : '#6b4320') + '"/>';
    }
    return (
      '<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">' +
      '<defs>' +
        '<linearGradient id="pg' + id + '" x1="0" y1="1" x2="0" y2="0">' +
          '<stop offset="0" stop-color="' + hue.deep + '"/>' +
          '<stop offset="0.55" stop-color="' + hue.mid + '"/>' +
          '<stop offset="1" stop-color="' + hue.tip + '"/>' +
        '</linearGradient>' +
        '<linearGradient id="pg2' + id + '" x1="0" y1="1" x2="0" y2="0">' +
          '<stop offset="0" stop-color="#e08a2a"/>' +
          '<stop offset="1" stop-color="' + hue.mid + '"/>' +
        '</linearGradient>' +
        '<radialGradient id="cg' + id + '">' +
          '<stop offset="0" stop-color="#7a4a1e"/>' +
          '<stop offset="0.7" stop-color="#4a2c10"/>' +
          '<stop offset="1" stop-color="#2b1706"/>' +
        '</radialGradient>' +
      '</defs>' +
      '<g>' + petals + '</g>' +
      '<g>' + inner + '</g>' +
      '<circle cx="50" cy="50" r="15" fill="url(#cg' + id + ')" stroke="#f4c542" stroke-width="0.8"/>' +
      '<g>' + seeds + '</g>' +
      '<circle cx="45" cy="45" r="4" fill="rgba(255,246,224,0.18)"/>' +
      '</svg>'
    );
  }

  var hues = [
    { deep: '#ff9d3d', mid: '#f4c542', tip: '#ffe27a' },
    { deep: '#ff9d3d', mid: '#f6c93e', tip: '#fff0b0' },
    { deep: '#f08a2c', mid: '#f4c542', tip: '#ffe89a' }
  ];

  // Arreglo centrado: x, y en %, tamaño en % del contenedor, rotación, retardo
  var arrangement = [
    { x: 50, y: 48, size: 34, rot: 0,   d: 0.55 },  // central, la más grande
    { x: 30, y: 42, size: 27, rot: -18, d: 0.85 },
    { x: 70, y: 42, size: 27, rot: 16,  d: 1.0 },
    { x: 22, y: 60, size: 21, rot: -32, d: 1.25 },
    { x: 78, y: 60, size: 21, rot: 30,  d: 1.35 },
    { x: 38, y: 68, size: 17, rot: -10, d: 1.55 },
    { x: 62, y: 68, size: 17, rot: 12,  d: 1.65 },
    { x: 50, y: 25, size: 20, rot: 6,   d: 1.15 },
    { x: 50, y: 72, size: 13, rot: 0,   d: 1.85 }
  ];

  var bouquet = document.getElementById('bouquet');
  var frag = document.createDocumentFragment();
  arrangement.forEach(function (f, i) {
    var el = document.createElement('div');
    el.className = 'flower';
    el.style.setProperty('--x', f.x + '%');
    el.style.setProperty('--y', f.y + '%');
    el.style.setProperty('--size', f.size + '%');
    el.style.setProperty('--rot', f.rot + 'deg');
    el.style.setProperty('--d', f.d + 's');
    el.style.zIndex = String(10 + Math.round(f.size));
    el.setAttribute('role', 'button');
    el.setAttribute('tabindex', '0');
    el.setAttribute('aria-label', 'Girasol ' + (i + 1) + ': tócalo para un mensaje');
    el.innerHTML = '<div class="inner">' +
      sunflowerSVG(i % 2 === 0 ? 18 : 16, hues[i % hues.length]) + '</div>';
    frag.appendChild(el);
  });
  bouquet.appendChild(frag);

  if (!reduceMotion) {
    // Tras florecer, añade un balanceo suave
    setTimeout(function () { bouquet.classList.add('settled'); }, 3400);
  }

  /* ---------- Estrellas ---------- */
  var starsRoot = document.getElementById('stars');
  var starCount = isSmall ? 90 : 160;
  var sfrag = document.createDocumentFragment();
  for (var s = 0; s < starCount; s++) {
    var st = document.createElement('span');
    st.className = 'star';
    var size = rand(1, 2.6);
    st.style.width = size + 'px';
    st.style.height = size + 'px';
    st.style.left = rand(0, 100) + '%';
    st.style.top = rand(0, 100) + '%';
    st.style.setProperty('--dur', rand(1.8, 4.5).toFixed(2) + 's');
    st.style.setProperty('--delay', (-rand(0, 5)).toFixed(2) + 's');
    st.style.setProperty('--min', rand(0.1, 0.45).toFixed(2));
    sfrag.appendChild(st);
  }
  starsRoot.appendChild(sfrag);

  /* ---------- Luciérnagas ---------- */
  var ffRoot = document.getElementById('fireflies');
  var ffCount = isSmall ? 12 : 22;
  var ffrag = document.createDocumentFragment();
  for (var f = 0; f < ffCount; f++) {
    var ff = document.createElement('span');
    ff.className = 'firefly';
    ff.style.left = rand(0, 100) + '%';
    ff.style.top = rand(0, 100) + '%';
    var range = isSmall ? 60 : 120;
    for (var n = 1; n <= 4; n++) {
      ff.style.setProperty('--dx' + n, rand(-range, range).toFixed(0) + 'px');
      ff.style.setProperty('--dy' + n, rand(-range, range).toFixed(0) + 'px');
    }
    ff.style.setProperty('--dur', rand(12, 24).toFixed(1) + 's');
    ff.style.setProperty('--pulse', rand(2.2, 4.5).toFixed(1) + 's');
    ff.style.setProperty('--delay', (-rand(0, 20)).toFixed(1) + 's');
    ff.style.setProperty('--delay2', (-rand(0, 4)).toFixed(1) + 's');
    ffrag.appendChild(ff);
  }
  ffRoot.appendChild(ffrag);

  /* ---------- Lluvia de pétalos ---------- */
  if (!reduceMotion) {
    var petalRoot = document.getElementById('petals');
    var petalCount = isSmall ? 18 : 32;
    var pfrag = document.createDocumentFragment();
    for (var p = 0; p < petalCount; p++) {
      var pt = document.createElement('span');
      pt.className = 'petal';
      pt.style.left = rand(0, 100) + '%';
      var scale = rand(0.6, 1.3);
      pt.style.width = (14 * scale).toFixed(1) + 'px';
      pt.style.height = (24 * scale).toFixed(1) + 'px';
      pt.style.setProperty('--dur', rand(10, 20).toFixed(1) + 's');
      pt.style.setProperty('--delay', rand(2.5, 22).toFixed(1) + 's');
      pt.style.setProperty('--sway', rand(2.5, 4.5).toFixed(1) + 's');
      pt.style.setProperty('--amp', rand(15, 45).toFixed(0) + 'px');
      pt.style.setProperty('--rot', (rand(0.5, 1) * (Math.random() < 0.5 ? -1 : 1) * 720).toFixed(0) + 'deg');
      pfrag.appendChild(pt);
    }
    petalRoot.appendChild(pfrag);
  }

  /* ---------- Interacción ---------- */
  var fx = document.getElementById('fx');
  var hint = document.getElementById('hint');
  var live = document.getElementById('live');
  var titleText = document.getElementById('titleText');
  var messages = [
    'Estás muy linda 🌻',
    'Tu sonrisa alegra cualquier día',
    'Eres una gran persona',
    'Brillas con luz propia ✨',
    'Qué suerte conocerte',
    'Eres pura buena vibra',
    'Tienes un corazón enorme',
    'Contigo todo es más divertido',
    'Eres increíble, no lo olvides',
    'Gracias por ser como eres 💛'
  ];
  var msgIndex = Math.floor(Math.random() * messages.length);
  var taps = 0;
  var SURPRISE_EVERY = 7;

  function hideHint() {
    if (hint && !hint.classList.contains('hide')) hint.classList.add('hide');
  }

  function remove(el, ms) {
    setTimeout(function () { if (el && el.parentNode) el.parentNode.removeChild(el); }, ms);
  }

  function sparks(x, y, count, spread) {
    if (reduceMotion) return;
    var frag = document.createDocumentFragment();
    for (var i = 0; i < count; i++) {
      var sp = document.createElement('span');
      sp.className = 'spark';
      var ang = Math.random() * Math.PI * 2;
      var dist = rand(spread * 0.4, spread);
      sp.style.setProperty('--x', x + 'px');
      sp.style.setProperty('--y', y + 'px');
      sp.style.setProperty('--tx', (Math.cos(ang) * dist).toFixed(0) + 'px');
      sp.style.setProperty('--ty', (Math.sin(ang) * dist).toFixed(0) + 'px');
      sp.style.setProperty('--s', rand(3, 8).toFixed(1) + 'px');
      sp.style.setProperty('--dur', rand(0.6, 1.2).toFixed(2) + 's');
      sp.style.setProperty('--c', Math.random() < 0.3 ? '#fff6e0' : (Math.random() < 0.5 ? '#f4c542' : '#ff9d3d'));
      frag.appendChild(sp);
      remove(sp, 1300);
    }
    fx.appendChild(frag);
  }

  function showMessage(x, y) {
    var text = messages[msgIndex % messages.length];
    msgIndex++;
    var m = document.createElement('span');
    m.className = 'msg';
    m.textContent = text;
    // Mantener el mensaje dentro de la pantalla
    var cx = Math.min(Math.max(x, 90), window.innerWidth - 90);
    m.style.left = cx + 'px';
    m.style.top = y + 'px';
    fx.appendChild(m);
    if (live) live.textContent = text;
    remove(m, reduceMotion ? 2200 : 2500);
  }

  function miniFlower(x, y) {
    var mf = document.createElement('div');
    mf.className = 'mini-flower';
    mf.style.left = x + 'px';
    mf.style.top = y + 'px';
    mf.style.setProperty('--s', rand(44, 80).toFixed(0) + 'px');
    mf.style.setProperty('--rot', rand(-30, 30).toFixed(0) + 'deg');
    mf.innerHTML = sunflowerSVG(Math.random() < 0.5 ? 16 : 18, hues[Math.floor(Math.random() * hues.length)]);
    fx.appendChild(mf);
    remove(mf, 5800);
  }

  function petalShower() {
    if (reduceMotion) return;
    var count = isSmall ? 40 : 70;
    var frag = document.createDocumentFragment();
    for (var i = 0; i < count; i++) {
      var pt = document.createElement('span');
      pt.className = 'petal';
      pt.style.left = rand(0, 100) + '%';
      var scale = rand(0.7, 1.4);
      pt.style.width = (14 * scale).toFixed(1) + 'px';
      pt.style.height = (24 * scale).toFixed(1) + 'px';
      pt.style.animationIterationCount = '1';
      pt.style.setProperty('--dur', rand(3.5, 6.5).toFixed(1) + 's');
      pt.style.setProperty('--delay', rand(0, 1.8).toFixed(2) + 's');
      pt.style.setProperty('--sway', rand(1.5, 3).toFixed(1) + 's');
      pt.style.setProperty('--amp', rand(15, 45).toFixed(0) + 'px');
      pt.style.setProperty('--rot', (rand(0.5, 1) * (Math.random() < 0.5 ? -1 : 1) * 720).toFixed(0) + 'deg');
      frag.appendChild(pt);
      remove(pt, 9000);
    }
    fx.appendChild(frag);
  }

  function surprise() {
    if (titleText) {
      titleText.classList.remove('shine');
      void titleText.offsetWidth; // reinicia la animación
      titleText.classList.add('shine');
    }
    petalShower();
    sparks(window.innerWidth / 2, window.innerHeight / 2, isSmall ? 30 : 60, Math.min(window.innerWidth, window.innerHeight) * 0.45);
    var m = document.createElement('span');
    m.className = 'msg';
    m.textContent = '¡Eres la mejor! 💛';
    m.style.left = (window.innerWidth / 2) + 'px';
    m.style.top = (window.innerHeight * 0.3) + 'px';
    m.style.fontSize = 'clamp(1.6rem, 6vw, 2.6rem)';
    fx.appendChild(m);
    if (live) live.textContent = m.textContent;
    remove(m, 2500);
  }

  function countTap() {
    taps++;
    if (taps % SURPRISE_EVERY === 0) setTimeout(surprise, 350);
  }

  function popFlower(flowerEl, x, y) {
    hideHint();
    flowerEl.classList.remove('pop');
    void flowerEl.offsetWidth; // reinicia la animación si se toca varias veces seguidas
    flowerEl.classList.add('pop');
    setTimeout(function () { flowerEl.classList.remove('pop'); }, 650);
    sparks(x, y, isSmall ? 16 : 26, 110);
    showMessage(x, y - 20);
    countTap();
  }

  // Tocar una flor del ramo
  bouquet.addEventListener('click', function (ev) {
    var flower = ev.target.closest ? ev.target.closest('.flower') : null;
    if (!flower) return;
    ev.stopPropagation();
    var r = flower.getBoundingClientRect();
    popFlower(flower, r.left + r.width / 2, r.top + r.height / 2);
  });

  // Teclado: Enter o espacio sobre una flor enfocada
  bouquet.addEventListener('keydown', function (ev) {
    if (ev.key !== 'Enter' && ev.key !== ' ') return;
    var flower = ev.target.closest ? ev.target.closest('.flower') : null;
    if (!flower) return;
    ev.preventDefault();
    var r = flower.getBoundingClientRect();
    popFlower(flower, r.left + r.width / 2, r.top + r.height / 2);
  });

  // Tocar el cielo: brota una flor pequeña en ese punto
  document.addEventListener('click', function (ev) {
    if (ev.target.closest && ev.target.closest('.flower')) return;
    hideHint();
    var x = ev.clientX, y = ev.clientY;
    if (typeof x !== 'number' || (x === 0 && y === 0)) return;
    miniFlower(x, y);
    sparks(x, y, isSmall ? 10 : 16, 70);
    countTap();
  });
})();
</script>
</body>
</html>
